{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Home{% endblock %} · CarPrice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'predictor/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>

<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="{% url 'predict' %}" class="brand">CarPrice</a>
            {% if user.is_authenticated %}
            <div class="nav-links">
                <a href="{% url 'predict' %}">Predict</a>
                <a href="{% url 'history' %}">History</a>
                <a href="{% url 'model_insights' %}">Insights</a>
                <span class="nav-user">{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="nav-logout">Logout</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
