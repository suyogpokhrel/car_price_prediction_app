<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
</head>
<body>
    <h2>Sign Up</h2>
    <form method="post">
    {% csrf_token %}
    {% for field in form %}
        <p>
            {{ field.label_tag }} {{ field }}
            {% if field.errors %}
                <span style="color: red;">{{ field.errors }}</span>
            {% endif %}
        </p>
    {% endfor %}
    <button type="submit">Sign Up</button>
</form>
    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
</body>
</html>
